<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Green 3D Gradient for S-ribbon -->
    <linearGradient id="smGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <!-- Cyan 3D Gradient for interlocking loop -->
    <linearGradient id="smCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="smDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#smDropShadow)">
    <!-- Cyan Ribbon Back Loop (Intertwining infinity knot wings) -->
    <path d="M 36 42 C 22 24 46 14 62 26 C 76 38 88 54 86 66 C 84 76 72 82 60 76 C 46 66 40 50 36 42 Z" 
          fill="url(#smCyanGrad)" />
    <path d="M 84 62 C 98 80 74 90 58 78 C 44 66 32 50 34 38 C 36 28 48 22 60 28 C 74 38 80 54 84 62 Z" 
          fill="url(#smCyanGrad)" opacity="0.92" />

    <!-- Green Main 'S' Ribbon (Dominant intertwined 3D stroke) -->
    <path d="M 72 32 C 64 20 48 20 40 28 C 30 38 32 50 48 58 C 66 66 70 78 60 88 C 50 96 36 94 28 84 C 24 78 26 72 32 72 C 36 72 38 76 42 80 C 46 84 54 84 58 80 C 64 74 62 66 48 58 C 30 48 24 38 34 24 C 44 12 66 12 78 24 C 82 28 80 34 74 34 C 72 34 71 33 72 32 Z" 
          fill="url(#smGreenGrad)" />
    
    <!-- Central Highlights & Depth Accent -->
    <path d="M 46 30 C 52 24 64 24 70 30" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 74 48 C 82 58 80 68 70 72" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>
</svg>
